<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator - Get Inspired Daily</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #e0e5ec;
            --bg-secondary: #f0f4f8;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent: #667eea;
            --accent-light: #764ba2;
            --shadow-sm: 2px 2px 5px #b8b9be, -3px -3px 7px #ffffff;
            --shadow-md: 4px 4px 10px #b8b9be, -5px -5px 15px #ffffff;
            --shadow-inset: inset 2px 2px 5px #b8b9be, inset -3px -3px 7px #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e5ec 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow-md);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            color: var(--accent);
            text-decoration: none;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .category-section {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .category-section label {
            font-weight: 700;
            color: var(--text-secondary);
        }

        .category-section select {
            padding: 10px 15px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .quote-box {
            padding: 40px;
            background: var(--bg-secondary);
            border-radius: 25px;
            box-shadow: var(--shadow-inset);
            margin-bottom: 30px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .quote-box i.fa-quote-left {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: var(--accent);
            opacity: 0.2;
        }

        .quote-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.4;
            font-style: italic;
        }

        .quote-author {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 700;
            text-align: right;
        }

        .quote-author::before {
            content: "— ";
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            box-shadow: var(--shadow-sm);
            flex: 1;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .btn-icon {
            width: 55px;
            height: 55px;
            background: var(--bg-secondary);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            padding: 0;
            font-size: 1.2rem;
        }

        .btn-icon:hover {
            box-shadow: var(--shadow-md);
            color: var(--accent-light);
        }

        .favorites-section {
            text-align: left;
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: 25px;
            box-shadow: var(--shadow-sm);
        }

        .favorites-section h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .favorite-item {
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 15px;
            box-shadow: var(--shadow-inset);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .favorite-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            line-height: 1.5;
        }

        .btn-delete {
            background: #fed7d7;
            color: #e53e3e;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #e53e3e;
            color: white;
        }

        @media (max-width: 600px) {
            .container { padding: 25px; }
            .quote-text { font-size: 1.3rem; }
            .btn-primary { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        
        <h1>✨ Quote Generator</h1>
        <p class="subtitle">Daily inspiration for your journey</p>

        <div class="category-section">
            <label for="category">Category:</label>
            <select id="category" onchange="getRandomQuote()">
                <option value="all">All Quotes</option>
                <option value="motivation">Motivation</option>
                <option value="success">Success</option>
                <option value="life">Life</option>
                <option value="friendship">Friendship</option>
            </select>
        </div>

        <div class="quote-box">
            <i class="fas fa-quote-left"></i>
            <div class="quote-text" id="quoteText">Click the button to get inspired...</div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="getRandomQuote()">
                <i class="fas fa-magic"></i> Get New Quote
            </button>
            <button class="btn btn-icon" onclick="copyQuote()" title="Copy Quote">
                <i class="fas fa-copy"></i>
            </button>
            <button class="btn btn-icon" onclick="toggleFavorite()" title="Add to Favorites" id="favoriteBtn">
                <i class="far fa-heart"></i>
            </button>
        </div>

        <div class="favorites-section">
            <h3><i class="fas fa-heart"></i> Favorite Quotes</h3>
            <div id="favoritesList"></div>
        </div>
    </div>

    <script>
        const quotes = {
            motivation: [
                { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
                { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
                { text: "Success is not final, failure is not fatal.", author: "Winston Churchill" },
                { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
                { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" }
            ],
            success: [
                { text: "Success is not about being the best. It's about being better than you were yesterday.", author: "Unknown" },
                { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
                { text: "Success usually comes to those who are too busy to be looking for it.", author: "Henry David Thoreau" },
                { text: "Don't be afraid to give up the good to go for the great.", author: "John D. Rockefeller" }
            ],
            life: [
                { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
                { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
                { text: "Life is either a daring adventure or nothing at all.", author: "Helen Keller" },
                { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" }
            ],
            friendship: [
                { text: "A true friend is one soul in two bodies.", author: "Aristotle" },
                { text: "Friendship is born at that moment when one person says to another, 'What! You too?'", author: "C.S. Lewis" },
                { text: "A friend is someone who knows all about you and still loves you.", author: "Elbert Hubbard" }
            ]
        };

        let currentQuote = null;
        let favorites = JSON.parse(localStorage.getItem('favoriteQuotes')) || [];

        function getRandomQuote() {
            const category = document.getElementById('category').value;
            let quoteList = category === 'all' ? Object.values(quotes).flat() : quotes[category];
            currentQuote = quoteList[Math.floor(Math.random() * quoteList.length)];
            
            document.getElementById('quoteText').textContent = currentQuote.text;
            document.getElementById('quoteAuthor').textContent = currentQuote.author;
            updateFavoriteBtn();
        }

        function copyQuote() {
            if (!currentQuote) return;
            const text = `"${currentQuote.text}" — ${currentQuote.author}`;
            navigator.clipboard.writeText(text).then(() => alert('Quote copied to clipboard!'));
        }

        function toggleFavorite() {
            if (!currentQuote) return;
            const index = favorites.findIndex(f => f.text === currentQuote.text);
            if (index === -1) {
                favorites.push(currentQuote);
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('favoriteQuotes', JSON.stringify(favorites));
            updateFavoriteBtn();
            renderFavorites();
        }

        function updateFavoriteBtn() {
            const btn = document.getElementById('favoriteBtn').querySelector('i');
            const isFav = currentQuote && favorites.some(f => f.text === currentQuote.text);
            btn.className = isFav ? 'fas fa-heart' : 'far fa-heart';
        }

        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            if (favorites.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-secondary); padding:20px;">No favorites yet.</p>';
                return;
            }
            list.innerHTML = favorites.map((f, i) => `
                <div class="favorite-item">
                    <p>"${f.text}" — ${f.author}</p>
                    <button class="btn-delete" onclick="removeFavorite(${i})">Remove</button>
                </div>
            `).join('');
        }

        function removeFavorite(index) {
            favorites.splice(index, 1);
            localStorage.setItem('favoriteQuotes', JSON.stringify(favorites));
            renderFavorites();
            updateFavoriteBtn();
        }

        renderFavorites();
    </script>
</body>
</html>
