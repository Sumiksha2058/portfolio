<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budhhi Chal - Select Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #e0e5ec;
            --bg-secondary: #f0f4f8;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent: #667eea;
            --accent-light: #764ba2;
            --shadow-sm: 2px 2px 5px #b8b9be, -3px -3px 7px #ffffff;
            --shadow-md: 4px 4px 10px #b8b9be, -5px -5px 15px #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e5ec 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            color: var(--accent);
            text-decoration: none;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 800;
        }
        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 50px;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }
        .card {
            padding: 3rem 2rem;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
        }
        .card i {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Budhhi Chal</h1>
        <p class="subtitle">Traditional Strategy Board Game</p>
        <div class="options">
            <a href="computer.html" class="card">
                <i class="fas fa-robot"></i>
                <h2>Vs Computer</h2>
            </a>
            <a href="friend.html" class="card">
                <i class="fas fa-users"></i>
                <h2>Vs Friend</h2>
            </a>
        </div>
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Fun Zone</a>
    </div>
</body>
</html>
