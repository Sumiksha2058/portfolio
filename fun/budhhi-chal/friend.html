<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budhhi Chal - Vs Friend</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --player1: #FF6B6B;
            --player2: #4ECDC4;
            --wood-dark: #3e2723;
            --wood-medium: #5d4037;
            --wood-light: #8d6e63;
            --cream: #f3e5ab;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c1b0e url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--cream);
        }
        .container {
            background: rgba(62, 39, 35, 0.95);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            max-width: 800px;
            width: 100%;
            border: 8px solid var(--wood-dark);
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .game-wrapper { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .board-section { display: flex; flex-direction: column; align-items: center; }
        .board {
            position: relative;
            width: 320px;
            height: 320px;
            background: #d7ccc8;
            border: 10px solid var(--wood-dark);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        svg { width: 100%; height: 100%; }
        .point { cursor: pointer; fill: #a1887f; transition: all 0.3s; }
        .point:hover { r: 12; fill: #8d6e63; }
        .piece { cursor: pointer; transition: all 0.2s; stroke: #fff; stroke-width: 2; }
        .piece.selected { stroke: #000; stroke-width: 3; filter: drop-shadow(0 0 8px rgba(0,0,0,0.5)); }
        .info-panel { flex: 1; min-width: 250px; background: var(--wood-medium); padding: 20px; border-radius: 15px; border: 2px solid var(--wood-dark); }
        .player-turn { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid transparent; }
        .player-turn.p1 { background: rgba(255, 107, 107, 0.2); color: var(--player1); border-color: var(--player1); }
        .player-turn.p2 { background: rgba(78, 205, 196, 0.2); color: var(--player2); border-color: var(--player2); }
        .phase-info { background: var(--wood-dark); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
        .pieces-count { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .piece-count { background: var(--wood-light); padding: 8px; border-radius: 8px; text-align: center; font-size: 0.8rem; }
        .btn { padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .btn-primary { background: #5d4037; box-shadow: 0 4px #3e2723; }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px #3e2723; }
        .message { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
        .message.show { display: block; background: var(--wood-dark); }
        .back-btn { position: absolute; top: 20px; left: 20px; color: var(--cream); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    <div class="container">
        <h1>Budhhi Chal</h1>
        <div class="game-wrapper">
            <div class="board-section">
                <div class="board">
                    <svg viewBox="0 0 300 300">
                        <g stroke="#5d4037" stroke-width="3">
                            <line x1="50" y1="50" x2="250" y2="50"/><line x1="50" y1="150" x2="250" y2="150"/><line x1="50" y1="250" x2="250" y2="250"/>
                            <line x1="50" y1="50" x2="50" y2="250"/><line x1="150" y1="50" x2="150" y2="250"/><line x1="250" y1="50" x2="250" y2="250"/>
                            <line x1="50" y1="50" x2="250" y2="250"/><line x1="250" y1="50" x2="50" y2="250"/>
                        </g>
                        <g id="points">
                            <circle class="point" cx="50" cy="50" r="10" data-pos="0"/><circle class="point" cx="150" cy="50" r="10" data-pos="1"/><circle class="point" cx="250" cy="50" r="10" data-pos="2"/>
                            <circle class="point" cx="50" cy="150" r="10" data-pos="3"/><circle class="point" cx="150" cy="150" r="10" data-pos="4"/><circle class="point" cx="250" cy="150" r="10" data-pos="5"/>
                            <circle class="point" cx="50" cy="250" r="10" data-pos="6"/><circle class="point" cx="150" cy="250" r="10" data-pos="7"/><circle class="point" cx="250" cy="250" r="10" data-pos="8"/>
                        </g>
                        <g id="pieces"></g>
                    </svg>
                </div>
            </div>
            <div class="info-panel">
                <div class="player-turn p1" id="playerTurn">Player 1's Turn</div>
                <div class="phase-info"><strong>Phase:</strong> <span id="phaseText">Placement</span></div>
                <div class="pieces-count">
                    <div class="piece-count">P1: <span id="p1Count">0</span>/3</div>
                    <div class="piece-count">P2: <span id="p2Count">0</span>/3</div>
                </div>
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn btn-primary" onclick="undoMove()">Undo</button>
                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        const positions = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
        const adjacency = [[1,3,4],[0,2,4],[1,4,5],[0,4,6],[0,1,2,3,5,6,7,8],[2,4,8],[3,4,7],[4,6,8],[4,5,7]];
        const winningLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        let state = { board: Array(9).fill(null), turn: 1, phase: 'placement', placed: {1:0, 2:0}, selected: null, winner: null, history: [] };

        function init() {
            document.querySelectorAll('.point').forEach(p => p.addEventListener('click', () => handleClick(parseInt(p.dataset.pos))));
            render();
               function handleClick(i) {
            playSound('clickSound');
            if (!gameActive || state.winner) return;  if (state.phase === 'placement') {
                if (state.board[i] === null) {
                    save();
                    state.board[i] = state.turn;
                    state.placed[state.turn]++;
                    if (state.placed[1] === 3 && state.placed[2] === 3) state.phase = 'movement';
                    checkWin() ? (state.winner = state.turn) : (state.turn = state.turn === 1 ? 2 : 1);
                    render();
                }
            } else {
                if (state.board[i] === state.turn) {
                    state.selected = state.selected === i ? null : i;
                    render();
                } else if (state.selected !== null && state.board[i] === null) {
                    if (adjacency[state.selected].includes(i)) {
                        save();
                        state.board[state.selected] = null;
                        state.board[i] = state.turn;
                        state.selected = null;
                        checkWin() ? (state.winner = state.turn) : (state.turn = state.turn === 1 ? 2 : 1);
                        render();
                    }
                }
            }
        }

        function checkWin() { return winningLines.some(l => l.every(p => state.board[p] === state.turn)); }
        function save() { state.history.push(JSON.stringify({board:[...state.board], turn:state.turn, phase:state.phase, placed:{...state.placed}})); }
        function undoMove() { if(state.history.length){ Object.assign(state, JSON.parse(state.history.pop())); state.winner=null; render(); } }
        function resetGame() { playSound('clickSound'); state = { board: Array(9).fill(null), turn: 1, phase: 'placement', placed: {1:0, 2:0}, selected: null, winner: null, history: [] }; render(); }

        function render() {
            const container = document.getElementById('pieces');
            container.innerHTML = '';
            state.board.forEach((p, i) => {
                if (p) {
                    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    c.setAttribute('cx', positions[i].x); c.setAttribute('cy', positions[i].y); c.setAttribute('r', '14');
                    c.setAttribute('fill', p === 1 ? '#FF6B6B' : '#4ECDC4');
                    c.setAttribute('class', `piece ${state.selected === i ? 'selected' : ''}`);
                    c.onclick = (e) => { e.stopPropagation(); handleClick(i); };
                    container.appendChild(c);
                }
            });
            document.getElementById('playerTurn').className = `player-turn p${state.turn}`;
            document.getElementById('playerTurn').textContent = state.winner ? `Player ${state.winner} Wins!` : `Player ${state.turn}'s Turn`;
            document.getElementById('phaseText').textContent = state.phase.charAt(0).toUpperCase() + state.phase.slice(1);
            document.getElementById('p1Count').textContent = state.placed[1];
            document.getElementById('p2Count').textContent = state.placed[2];
            const msg = document.getElementById('message');
            if (state.winner) { 
                playSound('winSound');
                msg.textContent = `🏆 Player ${state.winner} Wins!`; 
                msg.className = 'message show'; 
            } else { msg.className = 'message'; }
        }
        init();
    </script>

    <!-- Audio Elements -->
    <audio id="clickSound" src="../../assets/sounds/click.mp3"></audio>
    <audio id="winSound" src="../../assets/sounds/win.mp3"></audio>

    <script>
        // Sound effect function
        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Sound play failed:', e));
            }
        }
    </script>
</body>
</html>
