<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game - Roll and Win!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #e0e5ec;
            --bg-secondary: #f0f4f8;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent: #667eea;
            --accent-light: #764ba2;
            --shadow-sm: 2px 2px 5px #b8b9be, -3px -3px 7px #ffffff;
            --shadow-md: 4px 4px 10px #b8b9be, -5px -5px 15px #ffffff;
            --shadow-inset: inset 2px 2px 5px #b8b9be, inset -3px -3px 7px #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e5ec 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow-md);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            color: var(--accent);
            text-decoration: none;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .dice-section {
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: 25px;
            box-shadow: var(--shadow-inset);
            margin-bottom: 30px;
        }

        .dice-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
        }

        .dice-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dice-label {
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .dice {
            width: 100px;
            height: 100px;
            background: var(--bg-secondary);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .vs {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .result-message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .result-message.win { color: #38a169; box-shadow: var(--shadow-sm); }
        .result-message.lose { color: #e53e3e; box-shadow: var(--shadow-sm); }
        .result-message.draw { color: var(--accent); box-shadow: var(--shadow-sm); }

        .button-group {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary:hover {
            box-shadow: var(--shadow-md);
        }

        .score-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-card {
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
        }

        .score-card h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .score-card .score {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .history {
            text-align: left;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-inset);
            max-height: 200px;
            overflow-y: auto;
        }

        .history h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .dice { width: 80px; height: 80px; font-size: 2.5rem; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        
        <h1>🎲 Dice Game</h1>
        <p class="subtitle">Test your luck against the computer</p>

        <div class="dice-section">
            <div class="dice-container">
                <div class="dice-wrapper">
                    <span class="dice-label">You</span>
                    <div class="dice" id="playerDice">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="dice-wrapper">
                    <span class="dice-label">CPU</span>
                    <div class="dice" id="computerDice">0</div>
                </div>
            </div>

            <div class="result-message" id="resultMessage">Ready to roll?</div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="rollDice()"><i class="fas fa-dice"></i> Roll Dice</button>
                <button class="btn btn-secondary" onclick="resetGame()"><i class="fas fa-redo"></i> Reset</button>
            </div>
        </div>

        <div class="score-board">
            <div class="score-card">
                <h3>Your Score</h3>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-card">
                <h3>CPU Score</h3>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="history">
            <h3><i class="fas fa-history"></i> Game History</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="diceRollSound" src="../assets/sounds/dice-roll.mp3"></audio>
    <audio id="winSound" src="../assets/sounds/win.mp3"></audio>
    <audio id="lossSound" src="../assets/sounds/loss.mp3"></audio>
    <audio id="drawSound" src="../assets/sounds/click.mp3"></audio>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let gameHistory = [];

        // Sound effect functions
        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Sound play failed:', e));
            }
        }

        function rollDice() {
            const playerRoll = Math.floor(Math.random() * 6) + 1;
            const computerRoll = Math.floor(Math.random() * 6) + 1;

            // Play dice roll sound
            playSound('diceRollSound');

            document.getElementById('playerDice').textContent = playerRoll;
            document.getElementById('computerDice').textContent = computerRoll;

            let result = '';
            const resultEl = document.getElementById('resultMessage');
            
            if (playerRoll > computerRoll) {
                playerScore++;
                result = `🎉 You Win! ${playerRoll} > ${computerRoll}`;
                resultEl.className = 'result-message win';
                // Play win sound after a short delay
                setTimeout(() => playSound('winSound'), 300);
            } else if (computerRoll > playerRoll) {
                computerScore++;
                result = `😢 CPU Wins! ${computerRoll} > ${playerRoll}`;
                resultEl.className = 'result-message lose';
                // Play loss sound after a short delay
                setTimeout(() => playSound('lossSound'), 300);
            } else {
                result = `🤝 Draw! Both rolled ${playerRoll}`;
                resultEl.className = 'result-message draw';
                // Play draw sound after a short delay
                setTimeout(() => playSound('drawSound'), 300);
            }

            resultEl.textContent = result;
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;

            gameHistory.unshift(result);
            if (gameHistory.length > 10) gameHistory.pop();
            updateHistory();
        }

        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = gameHistory.map((item, index) => 
                `<div class="history-item">Round ${index + 1}: ${item}</div>`
            ).join('');
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            gameHistory = [];
            document.getElementById('playerDice').textContent = '0';
            document.getElementById('computerDice').textContent = '0';
            document.getElementById('playerScore').textContent = '0';
            document.getElementById('computerScore').textContent = '0';
            const resultEl = document.getElementById('resultMessage');
            resultEl.className = 'result-message';
            resultEl.textContent = 'Ready to roll?';
            updateHistory();
        }
    </script>
</body>
</html>
