<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Select Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #e0e5ec;
            --bg-secondary: #f0f4f8;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent: #667eea;
            --accent-light: #764ba2;
            --shadow-sm: 2px 2px 5px #b8b9be, -3px -3px 7px #ffffff;
            --shadow-md: 4px 4px 10px #b8b9be, -5px -5px 15px #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e5ec 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 40px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            color: var(--accent);
            text-decoration: none;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 50px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .mode-card {
            padding: 3rem 2rem;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .mode-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
        }

        .mode-icon {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .mode-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .mode-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .mode-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        
        <h1><i class="fas fa-calculator"></i> Calculator</h1>
        <p class="subtitle">Choose your calculator mode</p>

        <div class="mode-grid">
            <a href="general.html" class="mode-card">
                <div class="mode-icon"><i class="fas fa-plus"></i></div>
                <h2 class="mode-title">General</h2>
                <p class="mode-desc">Basic arithmetic operations for everyday calculations</p>
            </a>

            <a href="scientific.html" class="mode-card">
                <div class="mode-icon"><i class="fas fa-square-root-alt"></i></div>
                <h2 class="mode-title">Scientific</h2>
                <p class="mode-desc">Advanced functions including trigonometry and logarithms</p>
            </a>
        </div>
    </div>
</body>
</html>
