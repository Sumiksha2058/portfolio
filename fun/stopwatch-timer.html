<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch & Timer - Fun Zone</title>
    <script src="../theme-manager.js"></script>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .timer-card {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-md);
            text-align: center;
            margin-top: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .display {
            font-size: 5rem;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-primary);
            margin: 30px 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .timer-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .timer-inputs input {
            width: 70px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            text-align: center;
            font-size: 1.2rem;
        }

        .timer-inputs label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .hidden {
            display: none;
        }

        .laps {
            margin-top: 30px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .display {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link-container">
            <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Fun Zone</a>
        </div>

        <div class="timer-card">
            <div class="tabs">
                <button id="stopwatchTab" class="tab-btn active" onclick="switchTab('stopwatch')">Stopwatch</button>
                <button id="timerTab" class="tab-btn" onclick="switchTab('timer')">Timer</button>
            </div>

            <!-- Stopwatch UI -->
            <div id="stopwatchSection">
                <div id="stopwatchDisplay" class="display">00:00:00.00</div>
                <div class="controls">
                    <button id="swStart" class="btn btn-primary" onclick="startStopwatch()">Start</button>
                    <button id="swStop" class="btn btn-secondary hidden" onclick="stopStopwatch()">Stop</button>
                    <button id="swLap" class="btn btn-secondary" onclick="addLap()">Lap</button>
                    <button id="swReset" class="btn btn-secondary" onclick="resetStopwatch()">Reset</button>
                </div>
                <div id="lapsContainer" class="laps hidden"></div>
            </div>

            <!-- Timer UI -->
            <div id="timerSection" class="hidden">
                <div class="timer-inputs">
                    <div>
                        <input type="number" id="timerH" min="0" max="99" value="0">
                        <label>Hours</label>
                    </div>
                    <div>
                        <input type="number" id="timerM" min="0" max="59" value="0">
                        <label>Minutes</label>
                    </div>
                    <div>
                        <input type="number" id="timerS" min="0" max="59" value="0">
                        <label>Seconds</label>
                    </div>
                </div>
                <div id="timerDisplay" class="display">00:00:00</div>
                <div class="controls">
                    <button id="tmStart" class="btn btn-primary" onclick="startTimer()">Start</button>
                    <button id="tmStop" class="btn btn-secondary hidden" onclick="stopTimer()">Stop</button>
                    <button id="tmReset" class="btn btn-secondary" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Stopwatch variables
        let swStartTime, swElapsedTime = 0, swInterval;
        const swDisplay = document.getElementById('stopwatchDisplay');
        const swLaps = document.getElementById('lapsContainer');

        // Timer variables
        let tmInterval, tmRemainingTime = 0;
        const tmDisplay = document.getElementById('timerDisplay');

        function switchTab(tab) {
            document.getElementById('stopwatchTab').classList.toggle('active', tab === 'stopwatch');
            document.getElementById('timerTab').classList.toggle('active', tab === 'timer');
            document.getElementById('stopwatchSection').classList.toggle('hidden', tab !== 'stopwatch');
            document.getElementById('timerSection').classList.toggle('hidden', tab !== 'timer');
        }

        // --- Stopwatch Logic ---
        function startStopwatch() {
            swStartTime = Date.now() - swElapsedTime;
            swInterval = setInterval(updateStopwatch, 10);
            document.getElementById('swStart').classList.add('hidden');
            document.getElementById('swStop').classList.remove('hidden');
        }

        function stopStopwatch() {
            clearInterval(swInterval);
            document.getElementById('swStart').classList.remove('hidden');
            document.getElementById('swStop').classList.add('hidden');
        }

        function resetStopwatch() {
            stopStopwatch();
            swElapsedTime = 0;
            swDisplay.textContent = "00:00:00.00";
            swLaps.innerHTML = "";
            swLaps.classList.add('hidden');
        }

        function updateStopwatch() {
            swElapsedTime = Date.now() - swStartTime;
            swDisplay.textContent = formatTime(swElapsedTime, true);
        }

        function addLap() {
            if (swElapsedTime === 0) return;
            swLaps.classList.remove('hidden');
            const lapDiv = document.createElement('div');
            lapDiv.className = 'lap-item';
            lapDiv.innerHTML = `<span>Lap ${swLaps.children.length + 1}</span> <span>${formatTime(swElapsedTime, true)}</span>`;
            swLaps.prepend(lapDiv);
        }

        // --- Timer Logic ---
        function startTimer() {
            if (tmRemainingTime <= 0) {
                const h = parseInt(document.getElementById('timerH').value) || 0;
                const m = parseInt(document.getElementById('timerM').value) || 0;
                const s = parseInt(document.getElementById('timerS').value) || 0;
                tmRemainingTime = (h * 3600 + m * 60 + s) * 1000;
            }

            if (tmRemainingTime <= 0) return;

            document.getElementById('tmStart').classList.add('hidden');
            document.getElementById('tmStop').classList.remove('hidden');
            
            const startTime = Date.now();
            const initialRemaining = tmRemainingTime;

            tmInterval = setInterval(() => {
                const now = Date.now();
                tmRemainingTime = initialRemaining - (now - startTime);

                if (tmRemainingTime <= 0) {
                    tmRemainingTime = 0;
                    stopTimer();
                    alert("Time's up!");
                }
                tmDisplay.textContent = formatTime(tmRemainingTime, false);
            }, 100);
        }

        function stopTimer() {
            clearInterval(tmInterval);
            document.getElementById('tmStart').classList.remove('hidden');
            document.getElementById('tmStop').classList.add('hidden');
        }

        function resetTimer() {
            stopTimer();
            tmRemainingTime = 0;
            tmDisplay.textContent = "00:00:00";
            document.getElementById('timerH').value = 0;
            document.getElementById('timerM').value = 0;
            document.getElementById('timerS').value = 0;
        }

        // Helper: Format milliseconds to HH:MM:SS.ms
        function formatTime(ms, showMs) {
            let h = Math.floor(ms / 3600000);
            let m = Math.floor((ms % 3600000) / 60000);
            let s = Math.floor((ms % 60000) / 1000);
            let msPart = Math.floor((ms % 1000) / 10);

            let res = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            if (showMs) res += `.${msPart.toString().padStart(2, '0')}`;
            return res;
        }
    </script>
</body>
</html>
